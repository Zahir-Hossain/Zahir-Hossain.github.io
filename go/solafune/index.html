<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opening Solafune Repository</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TTTJSX37MX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-TTTJSX37MX');

  const destination = 'https://github.com/Zahir-Hossain/solafune-assignment';
  let redirected = false;

  function go() {
    if (redirected) return;
    redirected = true;
    window.location.replace(destination);
  }

  gtag('event', 'solafune_repo_click', {
    event_category: 'repository',
    event_label: 'solafune-assignment',
    transport_type: 'beacon',
    event_callback: go
  });

  setTimeout(go, 1200);
</script>
</head>
<body>
<p>Opening the Solafune repository…</p>
<noscript>
  <p><a href="https://github.com/Zahir-Hossain/solafune-assignment">Continue to the Solafune repository</a></p>
</noscript>
</body>
</html>
